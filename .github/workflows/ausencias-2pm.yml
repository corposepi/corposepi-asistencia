name: Procesar ausencias 2pm

on:
  schedule:
    # 19:00 UTC = 2:00pm hora Colombia (UTC-5), de lunes a viernes.
    # El propio script verifica feriados y semanas inactivas antes de descontar FNX.
    - cron: '0 19 * * 1-5'
  workflow_dispatch: {}

jobs:
  procesar-ausencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/procesar-ausencias.js
